<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>島嶼圖鑑 TW</title>

    <!-- 1. 網頁頁籤圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="images/icon-192.jpg">
    <!-- 2. Apple iOS 裝置主畫面圖示 (選填，提升手機體驗) -->
    <link rel="apple-touch-icon" href="images/icon-192.jpg">

    <!-- Leaflet 地圖套件 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet 全螢幕套件 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-fullscreen@1.0.2/dist/leaflet.fullscreen.css" />

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- 圖屠載入模塊升級 -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org">

    <!-- 引入 PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

    <!-- iOS (Safari) 專用設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="島嶼圖鑑">
    <link rel="apple-touch-icon" href="images/icon-192.png">
</head>

<body>

    <div class="app-container">
        <!-- 獨立頁首 -->
        <div id="header-container"></div>

        <!-- 主要內容區 -->
        <main>
            <!-- 1. 地圖容器區域 -->
            <div id="map-container" style="position: relative;">
                <div id="map"></div>
                <div id="loading-progress-container" class="progress-wrapper" style="display: none;">
                    <p id="progress-text">資料載入中，請稍候...</p>
                    <div class="progress-bar-bg">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 最近港口卡片區域（搜尋欄上方，獨立外層容器） -->
            <div class="nearest-port-container">
                <div id="nearestPortCard" class="port-card nearest-port-card" style="display: none;">
                    <div class="nearest-card-header">
                        <div class="nearest-badge-group">
                            <span class="nearest-tag">距離您最近港口</span>
                            <h3 id="nearestPortName" class="port-title">載入中...</h3>
                            <p id="nearestPortDesc" class="port-city">--</p>
                        </div>
                        <span id="nearestDistance" class="nearest-dist-badge">-- km</span>
                    </div>
                </div>
            </div>

            <!-- 3. 搜尋與多重篩選器區域 -->
            <div class="search-filter-container">
                <div class="search-box">
                    <input type="text" id="searchInput" class="filter-control search-input" placeholder="搜尋港口名稱或說明..."
                        oninput="handleSearchAndFilter()" />
                </div>
                <div class="filter-controls-group">
                    <select id="countyFilter" class="filter-control filter-select" onchange="handleCountyChange()">
                        <option value="all">全部縣市</option>
                    </select>
                    <select id="townFilter" class="filter-control filter-select" onchange="handleSearchAndFilter()">
                        <option value="all">全部鄉鎮市區</option>
                    </select>
                    <select id="statusFilter" class="filter-control filter-select" onchange="handleSearchAndFilter()">
                        <option value="all">全部狀態</option>
                        <option value="visited">已踩點</option>
                        <option value="unvisited">未踩點</option>
                    </select>
                </div>
            </div>

            <!-- 4. 港口卡片列表區域 -->
            <div id="port-list"></div>
        </main>

        <!-- 獨立頁尾 -->
        <div id="footer-container"></div>
    </div>

    <!-- Leaflet 地圖套件 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet 全螢幕套件 JS -->
    <script src="https://unpkg.com/leaflet-fullscreen@1.0.2/dist/leaflet.fullscreen.js"></script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/map.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 註冊成功！', reg))
                    .catch(err => console.error('Service Worker 註冊失敗：', err));
            });
        }
    </script>

    <script>
        function setRoundedFavicon(iconUrl, borderRadiusRatio = 0.2) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.src = iconUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const size = img.width || 128;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const radius = size * borderRadiusRatio; // 計算 20% 圓角半徑

                // 使用 Path 畫出 20% 圓角的矩形裁切區域
                ctx.beginPath();
                ctx.moveTo(radius, 0);
                ctx.arcTo(size, 0, size, size, radius);
                ctx.arcTo(size, size, 0, size, radius);
                ctx.arcTo(0, size, 0, 0, radius);
                ctx.arcTo(0, 0, size, 0, radius);
                ctx.closePath();
                ctx.clip();

                // 繪製圖片
                ctx.drawImage(img, 0, 0, size, size);

                // 替換或新增頁籤 Favicon 連結
                let link = document.querySelector("link[rel*='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.type = 'image/png';
                link.href = canvas.toDataURL('image/png');
            };
        }

        // 傳入圖片路徑，第二個參數 0.2 代表 20% 圓角
        setRoundedFavicon('images/icon-192.jpg', 0.25);
    </script>
</body>

</html>
